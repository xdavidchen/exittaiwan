{{ define "main" }}
  {{ partial "page-header" . }}

<section class="section-sm">
  <div class="container">
    <div class="row justify-center">
      <div class="md:col-10 lg:col-7">
        {{ if .Params.image }}{{ partial "image" (dict "Src" .Params.image "Context" .Page "Alt" .Title "Class" "mx-auto mb-6 rounded-md shadow-md object-cover"
        "Size" "800x300") }}{{ end }}

        <div class="content mt-5">{{ .Content }}</div>
      </div>
    </div>
  </div>
</section>
{{ partial "call-to-action" . }}
{{ end }}
