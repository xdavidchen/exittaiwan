{{$page_header := site.Params.page_header}}
{{ if $page_header.enable }}
<section class="mt-5">
  <div class="container text-center">
    <div
      class="bg-primary dark:bg-darkmode-light rounded-2xl px-8 py-14">
      <h1 class="text-white dark:text-white [text-shadow:2px_2px_0_rgba(0,0,0,0.2)]">{{ T (printf "%s" (lower .Title)) | default .Title | title }}</h1>
      {{ partial "components/breadcrumb" (dict "Context" . "Class" "mt-6") }}
    </div>
  </div>
</section>
{{ end }}
