  {code:'AUD', zh:'澳幣',       en:'Australian Dollar',    flag:'🇦🇺'},
  {code:'CAD', zh:'加拿大幣',    en:'Canadian Dollar',      flag:'🇨🇦'},
  {code:'NZD', zh:'紐西蘭幣',    en:'New Zealand Dollar',   flag:'🇳🇿'},
  {code:'AED', zh:'阿聯酋迪拉姆', en:'UAE Dirham',           flag:'🇦🇪'},
  {code:'TRY', zh:'土耳其里拉',  en:'Turkish Lira',         flag:'🇹🇷'},
];
const BASE = 'TWD';

const SAMPLE_RATES = { twd:1, usd:0.0310, eur:0.0269, jpy:4.95, krw:43.96, gbp:0.0231, chf:0.0247,
  isk:3.82, czk:0.653, huf:9.83, pln:0.1158, dkk:0.2012, sek:0.298, nok:0.315, hkd:0.242,
  cny:0.222, thb:1.07, sgd:0.0400, myr:0.1315, vnd:81.4, php:1.77, inr:2.965, idr:555.9,
  aud:0.0470, cad:0.0428, nzd:0.0518, aed:0.1140, try:1.32 };

/* ── i18n ── */
const LANG = {
  en: {
    title1: 'Live Currency', title2: 'Converter',
    heroSub: 'Data from fawazahmed0 Currency API · ',
    connecting: 'connecting…', live: 'LIVE',
    navBack: '← Back',
    converterTitle: 'Convert', labelFrom: 'From', labelTo: 'To',
    searchPlaceholder: 'Search currency…', refresh: 'Refresh',
    colCurrency: 'Currency', colRate: '1 unit = ? TWD', colChange: '24h Change', colAction: 'Quick convert',
    loading: 'Fetching live rates…', noResults: 'No results found.',
    liveData: 'live data', sampleData: 'sample data (fetch failed)',
    errMsg: 'Could not fetch live rates directly ({e}). Showing sample data below — this is common on localhost due to network restrictions; it will work fine once deployed.',
    discountNote: 'Change shows the TWD cost to buy 1 unit of that currency vs. yesterday — red ▲ means it got more expensive, green ▼ means cheaper.',
    footerUnit: 'Base currency: New Taiwan Dollar (TWD)', footerRefresh: 'Updated daily', footerSource: 'Data source',
    resultSub: '{amountFrom} {from} = {amountTo} {to}',
    clickHint: 'Click a row to load into the converter',
  },
  zh: {
    title1: '即時匯率', title2: '換算工具',
    heroSub: '資料來源：fawazahmed0 Currency API · ',
    connecting: '連接中…', live: '即時',
    navBack: '← 回主網站',
    converterTitle: '貨幣換算', labelFrom: '從', labelTo: '到',
    searchPlaceholder: '搜尋貨幣…', refresh: '更新',
    colCurrency: '貨幣', colRate: '1 單位 = ? TWD', colChange: '24小時漲跌', colAction: '快速換算',
    loading: '正在抓取即時匯率…', noResults: '找不到結果。',
    liveData: '即時資料', sampleData: '示範資料（抓取失敗）',
    errMsg: '無法直接抓取即時匯率（{e}）。這通常發生在本地端網路限制環境，部署後即可正常運作，以下顯示示範資料。',
    discountNote: '漲跌幅代表兌換 1 單位該貨幣所需的新台幣，較昨日增加以紅色▲顯示（該貨幣變貴），減少以綠色▼顯示（該貨幣變便宜）。',
    footerUnit: '基準貨幣：新台幣（TWD）', footerRefresh: '資料每日更新一次', footerSource: '資料來源',
    resultSub: '{amountFrom} {from} = {amountTo} {to}',
    clickHint: '點擊表格列可載入至換算器',
  },
};

let rates = {}, prevRates = null, currentLang = 'zh', dataLoaded = false, usingSample = false;
let sortCol = 'rate', sortDir = 1, lastUpdated = null;

/* Pick up ?from=XXX&to=YYY from an incoming link (e.g. the article embed's badge) —
   consumed once on first populateSelects() call, then cleared so later re-renders
   (language switch, refresh) don't stomp on whatever the visitor has since chosen. */
const urlParams = new URLSearchParams(location.search);
let urlFrom = (urlParams.get('from') || '').toUpperCase() || null;
let urlTo = (urlParams.get('to') || '').toUpperCase() || null;

function detectLang() {
  const langs = (navigator.languages || [navigator.language || 'zh']).map(l => l.toLowerCase());
  for (const l of langs) {
    if (l.startsWith('zh')) return 'zh';
    if (l.startsWith('en')) return 'en';
  }
  return 'zh';
}

function isoDaysBefore(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - n);
  return d.toISOString().slice(0, 10);
}

async function fetchRatesFor(tag) {
  const urls = [
    `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${tag}/v1/currencies/twd.json`,
    `https://${tag}.currency-api.pages.dev/v1/currencies/twd.json`,
  ];
  let lastErr;
  for (const url of urls) {
    try {
      const res = await fetch(url, { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      return { rates: data.twd, date: data.date };
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

/* ── Data loading ── */
async function loadData() {
  const t = LANG[currentLang];
  document.getElementById('tbody').innerHTML =
    `<tr class="state-row"><td colspan="4"><span class="spinner"></span>${t.loading}</td></tr>`;
  document.getElementById('error-area').innerHTML = '';
  try {
    const today = await fetchRatesFor('latest');
    rates = today.rates;
    lastUpdated = today.date;
    dataLoaded = true; usingSample = false;
    document.getElementById('updated-status').textContent = t.liveData;

    try {
      const yest = await fetchRatesFor(isoDaysBefore(today.date, 1));
      prevRates = yest.rates;
    } catch (e) { prevRates = null; }
  } catch (e) {
    rates = SAMPLE_RATES;
    prevRates = null;
    dataLoaded = true; usingSample = true;
    lastUpdated = null;
    document.getElementById('updated-status').textContent = t.sampleData;
    document.getElementById('error-area').innerHTML = `
      <div class="error-box" style="padding-left:2rem;padding-right:2rem">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>${t.errMsg.replace('{e}', e.message)}</span>
      </div>`;
  }
  document.getElementById('updated-time').textContent = lastUpdated ? lastUpdated + ' – ' : '';
  populateSelects();
  render();
  renderConverter('from');
}

function fmt(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  if (n >= 1000) return n.toLocaleString('zh-TW', { maximumFractionDigits: 1 });
  if (n >= 1) return n.toLocaleString('zh-TW', { maximumFractionDigits: 3 });
  if (n >= 0.01) return n.toLocaleString('zh-TW', { maximumFractionDigits: 5 });
  return n.toPrecision(4);
}

/* twdPerUnit: how many TWD to buy 1 unit of currency `code` */
function twdPerUnit(code, ratesObj) {
  const r = ratesObj[code.toLowerCase()];
  if (!r) return null;
  return 1 / r;
}

function changePct(code) {
  if (!prevRates) return null;
  const today = twdPerUnit(code, rates);
  const yest = twdPerUnit(code, prevRates);
  if (today === null || yest === null || yest === 0) return null;
  return ((today - yest) / yest) * 100;
}

/* ── Converter ── */
function populateSelects() {
  const all = [{ code: BASE, zh: '新台幣', en: 'Taiwan Dollar', flag: '🇹🇼' }, ...CURRENCIES];
  const validCodes = all.map(c => c.code);
  const fromSel = document.getElementById('conv-from');
  const toSel = document.getElementById('conv-to');
  const defaultFrom = (urlFrom && validCodes.includes(urlFrom)) ? urlFrom : BASE;
  const defaultTo = (urlTo && validCodes.includes(urlTo)) ? urlTo : 'EUR';
  const prevFrom = fromSel.value || defaultFrom;
  const prevTo = toSel.value || defaultTo;
  const opts = all.map(c => `<option value="${c.code}">${c.flag} ${c.code} — ${currentLang === 'zh' ? c.zh : c.en}</option>`).join('');
  fromSel.innerHTML = opts;
  toSel.innerHTML = opts;
  fromSel.value = validCodes.includes(prevFrom) ? prevFrom : BASE;
  toSel.value = validCodes.includes(prevTo) ? prevTo : 'EUR';
  urlFrom = null;
  urlTo = null;
}

function convert(amount, from, to) {
  if (!rates || !Object.keys(rates).length) return null;
  const rFrom = from === BASE ? 1 : rates[from.toLowerCase()];
  const rTo = to === BASE ? 1 : rates[to.toLowerCase()];
  if (!rFrom || !rTo) return null;
  return (amount / rFrom) * rTo;
}

function roundForInput(n) {
  if (n === null || n === undefined || isNaN(n)) return '';
  const digits = Math.abs(n) >= 100 ? 2 : Math.abs(n) >= 1 ? 4 : 6;
  return String(parseFloat(n.toFixed(digits)));
}

/* source: 'from' (amount box just edited) or 'to' — decides which box drives the calc */
function renderConverter(source) {
  const t = LANG[currentLang];
  const from = document.getElementById('conv-from').value;
  const to = document.getElementById('conv-to').value;
  const amountFromEl = document.getElementById('conv-amount');
  const amountToEl = document.getElementById('conv-amount-to');

  let amountFrom, amountTo;
  if (source === 'to') {
    amountTo = parseFloat(amountToEl.value) || 0;
    amountFrom = convert(amountTo, to, from);
    amountFromEl.value = amountFrom === null ? '' : roundForInput(amountFrom);
  } else {
    amountFrom = parseFloat(amountFromEl.value) || 0;
    amountTo = convert(amountFrom, from, to);
    amountToEl.value = amountTo === null ? '' : roundForInput(amountTo);
  }

  document.getElementById('conv-result-sub').textContent = (amountFrom === null || amountTo === null) ? '' :
    t.resultSub.replace('{amountFrom}', fmt(amountFrom)).replace('{from}', from).replace('{amountTo}', fmt(amountTo)).replace('{to}', to);
}

function swapCurrencies() {
  const fromSel = document.getElementById('conv-from');
  const toSel = document.getElementById('conv-to');
  const tmp = fromSel.value;
  fromSel.value = toSel.value;
  toSel.value = tmp;
  renderConverter('from');
}

function setConverterPair(from, to) {
  document.getElementById('conv-from').value = from;
  document.getElementById('conv-to').value = to;
  renderConverter('from');
  document.querySelector('.converter-card').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ── Table ── */
function sortBy(col) {
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
  render();
}

function updateSortUI() {
  ['name', 'rate', 'change'].forEach(c => {
    const th = document.getElementById('th-' + c), arr = document.getElementById('arr-' + c);
    if (!th || !arr) return;
    if (sortCol === c) { th.classList.add('sort-active'); arr.textContent = sortDir === 1 ? '↑' : '↓'; }
    else { th.classList.remove('sort-active'); arr.textContent = '↕'; }
  });
}

function render() {
  updateSortUI();
  const t = LANG[currentLang];
  const q = document.getElementById('search').value.toLowerCase();

  let rows = CURRENCIES.filter(c => {
    if (!q) return true;
    return c.code.toLowerCase().includes(q) || c.zh.includes(q) || c.en.toLowerCase().includes(q);
  }).map(c => ({ ...c, rate: twdPerUnit(c.code, rates), change: changePct(c.code) }));

  rows.sort((a, b) => {
    let av, bv;
    if (sortCol === 'name') { av = a.code; bv = b.code; }
    else if (sortCol === 'change') { av = a.change ?? -Infinity; bv = b.change ?? -Infinity; }
    else { av = a.rate ?? 0; bv = b.rate ?? 0; }
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });

  if (!rows.length) {
    document.getElementById('tbody').innerHTML = `<tr class="state-row"><td colspan="4">${t.noResults}</td></tr>`;
    return;
  }

  document.getElementById('tbody').innerHTML = rows.map(c => {
    const chg = c.change;
    const chgHtml = chg === null ? '<span class="chg flat">—</span>' :
      `<span class="chg ${chg > 0.005 ? 'up' : chg < -0.005 ? 'down' : 'flat'}">${chg > 0.005 ? '▲' : chg < -0.005 ? '▼' : '–'} ${Math.abs(chg).toFixed(2)}%</span>`;
    return `<tr onclick="setConverterPair('${c.code}','${BASE}')">
      <td><div class="cur-name">${c.flag} ${currentLang === 'zh' ? c.zh : c.en} <span class="cur-code">${c.code}</span></div></td>
      <td><span class="price-val">${fmt(c.rate)}</span> <small style="font-size:.7rem;color:var(--text3)">TWD</small></td>
      <td>${chgHtml}</td>
      <td><span style="color:var(--blue);font-weight:600;font-size:0.78rem">→ ${t.clickHint.split(' ')[0]}</span></td>
    </tr>`;
  }).join('');
}

/* ── Language ── */
function setLang(lang) {
  currentLang = lang;
  const t = LANG[lang];
  document.getElementById('hero-title-line1').childNodes[0].textContent = t.title1;
  document.getElementById('hero-title-line2').textContent = t.title2;
  document.getElementById('hero-sub').firstChild.textContent = t.heroSub;
  document.getElementById('live-label').textContent = t.live;
  document.getElementById('nav-back').textContent = t.navBack;
  document.getElementById('converter-title-text').textContent = t.converterTitle;
  document.getElementById('label-from').textContent = t.labelFrom;
  document.getElementById('label-to').textContent = t.labelTo;
  document.getElementById('search').placeholder = t.searchPlaceholder;
  document.getElementById('refresh-label').textContent = t.refresh;
  document.getElementById('col-currency').textContent = t.colCurrency;
  document.getElementById('col-rate').textContent = t.colRate;
  document.getElementById('col-change').textContent = t.colChange;
  document.getElementById('col-action').textContent = t.colAction;
  document.getElementById('discount-note-text').textContent = t.discountNote;
  document.getElementById('footer-unit').textContent = t.footerUnit;
  document.getElementById('footer-refresh').textContent = t.footerRefresh;
  document.getElementById('footer-source').textContent = t.footerSource;
  const statusEl = document.getElementById('updated-status');
  if (statusEl) statusEl.textContent = dataLoaded ? (usingSample ? t.sampleData : t.liveData) : t.connecting;
  populateSelects();
  render();
  renderConverter('from');
}

const detectedLang = detectLang();
document.getElementById('lang-picker').value = detectedLang;
setLang(detectedLang);
loadData();
</script>
